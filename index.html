<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#87CEEB"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="LONA OS"/>
<title>LONA OS</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --green:     #34C759;
  --green-deep:#248A3D;
  --gold:      #FFD60A;
  --gold-deep: #B89800;
  --purple:    #AF52DE;
  --purple-deep:#7B2FA8;
  --blue:      #007AFF;
  --red:       #FF3B30;
  --white:     #FFFFFF;
  --text:      #1C1C2E;
  --text-dim:  #3A3A4C;
  --text-muted:#8E8E93;
}

html { -webkit-text-size-adjust:100%; touch-action:manipulation; }

body {
  font-family: 'Nunito Sans', system-ui, sans-serif;
  min-height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  overflow-x: hidden;
  background: #87CEEB;
  -webkit-font-smoothing: antialiased;
}

/* ── OZADJE ─────────────────────────────────────────────── */
#bg-img {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}
#bg-img img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top;
  display: block;
}

/* ── VSEBINA ─────────────────────────────────────────────── */
.screen {
  position: relative; z-index: 1;
  width: 100%; max-width: 400px;
  min-height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 0 20px calc(40px + env(safe-area-inset-bottom));
  padding-top: max(48px, env(safe-area-inset-top));
}

/* ── LOGO BLOK ───────────────────────────────────────────── */
.logo-block {
  text-align: center;
  margin-bottom: 28px;
}

.logo-badge {
  display: inline-block;
  font-size: .62rem; font-weight: 900;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--purple-deep);
  background: rgba(255,255,255,.9);
  border: 2.5px solid var(--purple);
  border-radius: 30px;
  padding: 5px 14px;
  margin-bottom: 14px;
  box-shadow: 0 3px 0 rgba(175,82,222,.25);
}

.logo-cloud {
  position: relative;
  display: inline-block;
  margin-bottom: 8px;
}

.logo-title {
  font-family: 'Nunito', sans-serif;
  font-size: 4rem; font-weight: 900;
  color: var(--white);
  letter-spacing: -.01em; line-height: 1;
  text-shadow:
    3px 3px 0 rgba(0,0,0,.15),
    0 6px 20px rgba(0,0,0,.2);
  position: relative; z-index: 1;
}
.logo-title em {
  font-style: normal;
  color: var(--gold);
  text-shadow:
    3px 3px 0 rgba(0,0,0,.15),
    0 0 30px rgba(255,214,10,.4);
}

.logo-sub {
  font-size: .68rem; font-weight: 800;
  letter-spacing: .16em; text-transform: uppercase;
  color: rgba(255,255,255,.75);
  text-shadow: 0 1px 4px rgba(0,0,0,.2);
  margin-top: 4px;
}

/* ── BRIFING BOX ─────────────────────────────────────────── */
.briefing-box {
  width: 100%;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(12px);
  border: 2.5px solid rgba(255,255,255,.6);
  border-radius: 20px;
  padding: 14px 18px;
  margin-bottom: 24px;
  box-shadow: 0 4px 0 rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.1);
  display: flex; align-items: flex-start; gap: 12px;
}
.briefing-icon {
  font-size: 1.6rem; flex-shrink: 0; margin-top: 2px;
}
.briefing-content {}
.briefing-label {
  font-size: .58rem; font-weight: 900;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--purple); margin-bottom: 3px;
}
.briefing-text {
  font-size: .88rem; font-weight: 700;
  color: var(--text-dim); line-height: 1.4;
}

/* ── AGENT KARTICE ───────────────────────────────────────── */
.agents {
  display: flex; flex-direction: column;
  gap: 12px; width: 100%;
}

.agent-card {
  width: 100%;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px);
  border: 2.5px solid rgba(255,255,255,.7);
  border-radius: 22px;
  cursor: pointer;
  position: relative; overflow: hidden;
  text-align: left;
  font-family: 'Nunito Sans', sans-serif;
  box-shadow: 0 5px 0 rgba(0,0,0,.08), 0 8px 20px rgba(0,0,0,.1);
  transition: transform .15s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.agent-card:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(0,0,0,.08);
}

/* Barvna leva bordura glede na agenta */
.agent-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 5px;
  border-radius: 22px 0 0 22px;
  background: var(--agent-color, var(--green));
}

/* XP progress bar na dnu */
.agent-card::after {
  content: '';
  position: absolute; bottom: 0; left: 0;
  height: 3px; width: var(--xp-pct, 0%);
  background: var(--agent-color, var(--green));
  border-radius: 0 0 0 22px;
  opacity: .5;
  transition: width .8s ease;
}

.agent-avatar {
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(0,0,0,.06);
  border: 3px solid var(--agent-color, var(--green));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; flex-shrink: 0;
  box-shadow: 0 4px 0 rgba(0,0,0,.1);
  overflow: hidden; position: relative;
}
.agent-avatar img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top;
  border-radius: 50%;
}
.agent-avatar-camera {
  position: absolute; bottom: -2px; right: -2px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--white);
  border: 2px solid var(--agent-color, var(--green));
  display: flex; align-items: center; justify-content: center;
  font-size: .6rem; z-index: 2;
}

.agent-info { flex: 1; min-width: 0; }
.agent-name {
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem; font-weight: 900;
  color: var(--text); margin-bottom: 2px;
}
.agent-rank {
  font-size: .62rem; font-weight: 900;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--agent-color, var(--green));
  margin-bottom: 2px;
}
.agent-xp {
  font-size: .78rem; font-weight: 700;
  color: var(--text-muted);
}

.agent-arrow {
  font-size: 1.2rem;
  color: var(--agent-color, var(--green));
  flex-shrink: 0;
  font-weight: 900;
}

/* ── DIVIDER ─────────────────────────────────────────────── */
.or-divider {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 2px 0;
}
.or-divider::before, .or-divider::after {
  content: ''; flex: 1; height: 2px;
  background: rgba(255,255,255,.5);
  border-radius: 2px;
}
.or-divider span {
  font-size: .65rem; font-weight: 900;
  color: rgba(255,255,255,.7);
  letter-spacing: .1em; text-transform: uppercase;
  text-shadow: 0 1px 3px rgba(0,0,0,.2);
}

/* ── FOOTER ──────────────────────────────────────────────── */
.login-footer {
  margin-top: 28px;
  text-align: center;
  font-size: .62rem; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase;
  color: rgba(255,255,255,.5);
  text-shadow: 0 1px 3px rgba(0,0,0,.15);
}

/* ── ANIMACIJE ───────────────────────────────────────────── */
@keyframes bounce-in {
  0%  { opacity:0; transform:translateY(20px) scale(.92); }
  60% { transform:translateY(-4px) scale(1.02); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}
@keyframes float-logo {
  0%,100%{ transform: translateY(0); }
  50%    { transform: translateY(-6px); }
}
@keyframes spin-star {
  to { transform: rotate(360deg); }
}

.logo-cloud { animation: float-logo 4s ease-in-out infinite; }

.agent-card {
  opacity: 0;
  animation: bounce-in .4s cubic-bezier(.17,.67,.35,1.1) forwards;
}
.agent-card:nth-child(1) { animation-delay: .15s; }
.agent-card:nth-child(2) { animation-delay: .25s; }
.agent-card:nth-child(3) { animation-delay: .35s; }

/* Zvezde v ozadju */
.star {
  position: fixed;
  pointer-events: none; z-index: 0;
  font-size: 1.2rem;
  animation: spin-star 8s linear infinite;
  opacity: .15;
}
</style>
</head>
<body>

<!-- Ozadje -->
<div id="bg-img">
  <img src="assets/bg-day.png" id="bg-source" alt=""/>
</div>

<!-- Dekorativne zvezde -->
<div class="star" style="top:8%;left:5%;animation-duration:6s">⭐</div>
<div class="star" style="top:12%;right:8%;animation-duration:9s;animation-direction:reverse">✨</div>
<div class="star" style="top:6%;left:40%;animation-duration:7s">🌟</div>

<div class="screen">

  <!-- LOGO -->
  <div class="logo-block">
    <div class="logo-badge">🎖️ Poveljniški Terminal</div>
    <div class="logo-cloud">
      <h1 class="logo-title">LON<em>A</em></h1>
    </div>
    <p class="logo-sub">Misije · XP · Nagrade</p>
  </div>

  <!-- BRIFING -->
  <div class="briefing-box">
    <div class="briefing-icon" id="briefing-icon">📋</div>
    <div class="briefing-content">
      <div class="briefing-label">Dnevni brifing</div>
      <div class="briefing-text" id="briefing-text">Kateri agent prevzema danes misijo?</div>
    </div>
  </div>

  <!-- AGENT KARTICE -->
  <div class="agents" id="agents-list"></div>

  <p class="login-footer">LONA OS · Sezona 1 · v2.6</p>

</div>

<script src="config.js"></script>
<script>
// ── OZADJE glede na čas ─────────────────────────────────────
(function() {
  const h = new Date().getHours();
  if (h >= 19 || h < 6) {
    const img = document.getElementById('bg-source');
    const night = 'assets/bg-night.png';
    const testImg = new Image();
    testImg.onload = () => { img.src = night; };
    testImg.src = night;
    document.body.style.background = '#1A1446';
  }
})();

// ── BRIFING glede na uro ────────────────────────────────────
const h = new Date().getHours();
const briefings = [
  [6,  '🌅', 'Jutro, Agent! Standard 0 te čaka.'],
  [10, '☀️', 'Dopoldne. Baza je aktivna. Misije so odprte!'],
  [14, '🌤️', 'Popoldanski sektor. Čas za akcijo!'],
  [18, '🌆', 'Večerni brifing. Preveri zakladnico.'],
  [21, '🌙', 'Nočna izmena. Zaključi dan z odliko!'],
];
const [, bIcon, bText] = [...briefings].reverse().find(([t]) => h >= t) || briefings[0];
document.getElementById('briefing-icon').textContent = bIcon;
document.getElementById('briefing-text').textContent = bText;

// ── RANG iz XP ──────────────────────────────────────────────
function getRank(xp) {
  const ranks = [...LONA_CONFIG.ranks].reverse();
  return ranks.find(r => xp >= r.minXp)?.label || LONA_CONFIG.ranks[0].label;
}
function getXp(agentId) {
  const s = localStorage.getItem('lona_xp_state');
  if (s) return JSON.parse(s)[agentId] ?? 0;
  return LONA_CONFIG.agents.find(a => a.id === agentId)?.xp ?? 0;
}
function getMaxXp(agentId) {
  const s = localStorage.getItem('lona_rank_state');
  if (s) return JSON.parse(s)[agentId] ?? getXp(agentId);
  return getXp(agentId);
}
function xpPct(agentId) {
  const xp = getMaxXp(agentId);
  const ranks = LONA_CONFIG.ranks;
  const ci = ranks.findIndex(r => r.minXp > xp);
  const lo = ranks[Math.max(0, ci - 1)]?.minXp ?? 0;
  const hi = ranks[ci]?.minXp ?? lo + 300;
  return Math.min(100, Math.round(((xp - lo) / (hi - lo)) * 100));
}
function weekMissions(agentId) {
  const log = JSON.parse(localStorage.getItem('lona_mission_log') || '[]');
  const now = new Date();
  const jan1 = new Date(now.getFullYear(), 0, 1);
  const wk = Math.ceil(((now - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  const key = now.getFullYear() + '-W' + wk;
  return log.filter(e => e.agentId === agentId && e.week === key).length;
}

// Barve za agente — vsak agent dobi svojo barvo
const AGENT_COLORS = ['#34C759', '#007AFF', '#AF52DE', '#FF9500', '#FF2D55'];

// ── AGENT KARTICE ────────────────────────────────────────────
const list = document.getElementById('agents-list');

LONA_CONFIG.agents.forEach((agent, i) => {
  if (i > 0) {
    const div = document.createElement('div');
    div.className = 'or-divider';
    div.innerHTML = '<span>ali</span>';
    list.appendChild(div);
  }

  const xp    = getXp(agent.id);
  const rank  = getRank(getMaxXp(agent.id));
  const pct   = xpPct(agent.id);
  const wkMis = weekMissions(agent.id);
  const color = AGENT_COLORS[i % AGENT_COLORS.length];
  const photo = localStorage.getItem('lona_photo_' + agent.id);

  const card = document.createElement('button');
  card.className = 'agent-card';
  card.style.setProperty('--agent-color', color);
  card.style.setProperty('--xp-pct', pct + '%');

  const avatarHTML = photo
    ? `<img src="${photo}" alt="${agent.name}"/>`
    : agent.avatar;

  card.innerHTML = `
    <div class="agent-avatar" style="border-color:${color}">
      ${avatarHTML}
      <div class="agent-avatar-camera">📷</div>
    </div>
    <div class="agent-info">
      <div class="agent-name">${agent.name}</div>
      <div class="agent-rank">${rank}</div>
      <div class="agent-xp">${xp} XP · ${wkMis} misij ta teden</div>
    </div>
    <div class="agent-arrow">→</div>
  `;

  card.addEventListener('click', () => {
    localStorage.setItem('lona_current_agent', agent.id);
    card.style.transform = 'translateY(4px)';
    card.style.boxShadow = '0 1px 0 rgba(0,0,0,.08)';
    setTimeout(() => { location.href = 'gatekeeper.html'; }, 180);
  });

  list.appendChild(card);
});

// ── SERVICE WORKER ──────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
