<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#1E2438"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans','DM Sans',system-ui,sans-serif;background:#F0F4FF;color:#1C1C2E;min-height:100dvh;padding-bottom:var(--page-padding-bottom);overflow-x:hidden}

/* TOP BAR */
.top-bar{display:flex;align-items:center;gap:10px;padding:var(--topbar-padding);background:rgba(255,255,255,.95);border-bottom:2.5px solid rgba(0,0,0,.07);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
.top-bar__logo{font-family:'Nunito',sans-serif;font-size:var(--topbar-logo-size);color:#1C1C2E;font-weight:900;letter-spacing:.06em;flex-shrink:0}
.logo-accent{color:#72D68A}
.top-bar__agent{flex:1;display:flex;align-items:center;gap:6px;cursor:pointer;justify-content:center}
.top-bar__agent-name{font-size:var(--topbar-agent-size);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8E8E93}
.status-dot{width:6px;height:6px;border-radius:50%;background:#72D68A;flex-shrink:0}

/* CMD PANEL */
#cmd-panel-section{padding:0 var(--page-padding-x)}

/* VIEWS */
.view{display:none;animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* LOCATION PICKER */
.loc-pick-wrap{display:grid;grid-template-columns:var(--locpick-cols);gap:var(--locpick-gap);padding:var(--locpick-padding)}
.loc-pick-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:var(--locpick-btn-pad);border-radius:var(--locpick-radius);border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.10);cursor:pointer;transition:all .2s ease;-webkit-tap-highlight-color:transparent;font-family:var(--font-body);touch-action:manipulation}
.loc-pick-btn:active{transform:scale(.93)}
.loc-pick-btn__icon{font-size:var(--locpick-icon-size);line-height:1}
.loc-pick-btn__label{font-size:var(--locpick-label-size);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:rgba(240,238,248,.6)}
.loc-pick-btn--active{transform:scale(1.04)}
.loc-pick-btn--eq.loc-pick-btn--active{background:rgba(175,82,222,.18);border-color:rgba(175,82,222,.5)}
.loc-pick-btn--eq.loc-pick-btn--active .loc-pick-btn__label{color:#CF8FFF}
.loc-pick-btn--indoor.loc-pick-btn--active{background:rgba(120,160,255,.2);border-color:rgba(90,175,122,.4)}
.loc-pick-btn--indoor.loc-pick-btn--active .loc-pick-btn__label{color:#72D68A}
.loc-pick-btn--outdoor.loc-pick-btn--active{background:rgba(52,199,89,.12);border-color:rgba(52,199,89,.35)}
.loc-pick-btn--outdoor.loc-pick-btn--active .loc-pick-btn__label{color:#34C759}
.loc-pick-btn--mine.loc-pick-btn--active{background:rgba(255,149,0,.12);border-color:rgba(255,149,0,.35)}
.loc-pick-btn--mine.loc-pick-btn--active .loc-pick-btn__label{color:#FF9500}
.loc-pick-btn--skupaj.loc-pick-btn--active{background:rgba(0,122,255,.12);border-color:rgba(0,122,255,.35)}
.loc-pick-btn--skupaj.loc-pick-btn--active .loc-pick-btn__label{color:#5AC8FA}

/* MISSION CARDS */
.mission-list{display:flex;flex-direction:column;gap:var(--mc-gap)}
.mc{display:flex!important;align-items:center;gap:12px;padding:var(--mc-padding);border-radius:var(--mc-radius);cursor:pointer;-webkit-tap-highlight-color:transparent;opacity:0;transform:translateY(10px);animation:none!important}
.mc.mc-in{opacity:1!important;transform:translateY(0)!important;transition:opacity .28s ease,transform .28s ease}
.mc:active{transform:scale(.97);filter:brightness(1.1)}
.mc.mc-locked{opacity:.38;cursor:not-allowed}
.mc__icon{width:var(--mc-icon-size);height:var(--mc-icon-size);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:var(--mc-icon-font);flex-shrink:0}
.mc__body{flex:1;min-width:0}
.mc__name{font-size:var(--mc-name-size);font-weight:700;color:#F0EEF8;margin:0;line-height:1.2}
.mc__desc{font-size:var(--mc-desc-size);color:rgba(240,238,248,.38);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc__right{flex-shrink:0;text-align:right}
.mc__xp{font-size:var(--mc-xp-size);font-weight:800;margin:0;line-height:1}
.mc__joker{font-size:10px;color:#FFD60A;margin:2px 0 0;font-weight:700}
.mc__joker-btn{padding:4px 9px;border-radius:9px;background:rgba(255,209,102,.15);border:1px solid rgba(255,209,102,.35);color:#FFD60A;font-size:11px;font-weight:800;cursor:pointer;margin-top:4px;display:block;font-family:'DM Sans',sans-serif}
.mc__joker-btn:active{transform:scale(.93)}

/* RIBBON */
.ribbon-wrap{padding:8px var(--page-padding-x) 0}
.ribbon{display:flex;flex-direction:column;gap:var(--rb-gap)}
.rb{display:flex;align-items:center;gap:10px;padding:var(--rb-padding);border-radius:var(--rb-radius);cursor:pointer;transition:transform .15s ease;-webkit-tap-highlight-color:transparent;opacity:0;transform:translateX(-6px)}
.rb.rb-in{opacity:1;transform:translateX(0);transition:opacity .25s ease,transform .25s ease}
.rb:active{transform:scale(.97)}
.rb__icon{width:var(--rb-icon-size);height:var(--rb-icon-size);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:var(--rb-icon-font);flex-shrink:0}
.rb__body{flex:1;min-width:0}
.rb__name{font-size:var(--rb-name-size);font-weight:700;color:#F0EEF8;margin:0}
.rb__cat{font-size:10px;color:rgba(240,238,248,.38);margin:1px 0 0}
.rb__xp{font-size:var(--rb-xp-size);font-weight:800;flex-shrink:0}

/* RANDOM MISSION CARD */
.rmc-wrap{padding:0 var(--page-padding-x)}
.rmc-scratch{border-radius:var(--rmc-radius);overflow:hidden;position:relative;min-height:var(--rmc-min-height);width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;background:linear-gradient(135deg,#2d1a50,#4a1580,#6a20aa);padding:var(--rmc-padding);gap:12px}
.rmc-scratch:active{transform:scale(.98)}
.rmc-scratch__q{font-size:4rem;display:block;animation:float-q 3s ease-in-out infinite}
@keyframes float-q{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.rmc-scratch__label{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.rmc-scratch__btn{padding:13px 28px;border-radius:16px;background:#fff;border:none;color:#fff;font-size:.95rem;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s ease}
.rmc-scratch__btn:active{transform:scale(.95);background:rgba(255,255,255,.28)}
.rmc-spinning .rmc-scratch__q{animation:spin-out .25s ease forwards}
@keyframes spin-out{100%{opacity:0;transform:scale(.4) rotate(180deg)}}
.rmc-revealed{border-radius:var(--rmc-radius);overflow:hidden;position:relative;min-height:var(--rmc-min-height);width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;animation:reveal-in .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes reveal-in{from{opacity:0;transform:scale(.85) rotateY(20deg)}to{opacity:1;transform:scale(1) rotateY(0)}}
.rmc-revealed__bg{position:absolute;inset:0}
.rmc-revealed__overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.2) 55%,transparent 100%)}
.rmc-revealed__body{position:relative;padding:24px 20px;width:100%}
.rmc-revealed__cat{font-size:.6rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:8px}
.rmc-revealed__icon{font-size:var(--rmc-icon-size);display:block;margin-bottom:8px}
.rmc-revealed__name{font-family:'DM Serif Display',serif;font-size:var(--rmc-title-size);color:#fff;margin:0 0 4px;line-height:1.2}
.rmc-revealed__desc{font-size:var(--rmc-desc-size);color:rgba(255,255,255,.55);margin:0 0 14px}
.rmc-pills{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.rmc-pill{padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:800}
.rmc-pill--xp{background:rgba(114,214,138,.2);color:#72D68A;border:1px solid rgba(114,214,138,.35)}
.rmc-pill--coins{background:rgba(255,214,10,.15);color:#FFD60A;border:1px solid rgba(255,214,10,.3)}
.rmc-pill--joker{background:rgba(255,209,102,.15);color:#FFD60A;border:1px solid rgba(255,209,102,.3)}
.rmc-btns{display:flex;gap:8px;justify-content:center}
.rmc-btn-do{padding:13px 32px;border-radius:14px;background:#fff;color:#1a1a2e;font-size:.9rem;font-weight:800;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:transform .15s ease}
.rmc-btn-do:active{transform:scale(.95)}
.rmc-btn-sm{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;transition:transform .15s ease;font-family:'DM Sans',sans-serif}
.rmc-btn-sm:active{transform:scale(.92)}
.rmc-btn-skip{background:rgba(255,209,102,.2);color:#FFD60A;border:1px solid rgba(255,209,102,.4)}
.rmc-btn-next{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);border:none}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:var(--nav-width);max-width:var(--nav-max-width);display:flex;background:rgba(10,18,10,.94);border:1px solid rgba(120,160,255,.22);border-radius:var(--nav-radius);padding:var(--nav-padding);padding-bottom:max(8px,env(safe-area-inset-bottom));gap:0;z-index:100;backdrop-filter:blur(16px);box-shadow:0 4px 24px rgba(0,0,0,.5)}
.bottom-nav__item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;cursor:pointer;position:relative;background:none;border:none;-webkit-tap-highlight-color:transparent}
.bottom-nav__item svg{width:var(--nav-icon-size);height:var(--nav-icon-size)}
.bottom-nav__item span{font-size:var(--nav-label-size);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(240,238,248,.45)}
.bottom-nav__item--active span{color:#72D68A;font-weight:800}
.bottom-nav__item--active::after{content:"";position:absolute;bottom:-4px;width:4px;height:4px;border-radius:50%;background:#72D68A}

/* SETTINGS */
.settings-overlay{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);align-items:center;justify-content:center}
</style>

/* ── PARALLAX ─────────────────────────────────────────────── */
[data-parallax] {
  transition: transform 0.05s linear;

/* Ozadje mora biti večje da ni vidnih robov med premikanjem */

<body>

<div data-parallax="1" id="bg-wrap" style="position:fixed;inset:-5%;z-index:0;overflow:hidden;pointer-events:none"><img src="assets/bg-day.png" id="bg-source" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center top"></div>
<header class="top-bar" style="position:relative;z-index:100">
  <div class="top-bar__logo" onclick="location.replace('index.html')" style="cursor:pointer">[LONA<span class="logo-accent">_OS</span>]</div>
  <div class="top-bar__agent" onclick="location.replace('index.html')" title="Zamenjaj agenta">
    <span class="status-dot"></span>
    <span class="top-bar__agent-name" id="current-agent-name">Agent</span>
    <span style="font-size:.65rem;opacity:.4">⇄</span>
  </div>
  <button onclick="document.getElementById('settings-panel').style.display='flex'"

  <button onclick="location.href='commander.html'"
    style="width:34px;height:34px;border-radius:50%;background:#F5EEFF;border:2.5px solid #AF52DE;color:#AF52DE;font-size:14px;cursor:pointer;flex-shrink:0;box-shadow:0 2px 0 #7B2FA8" title="Commander Panel">🎖️</button>

  <!-- MOBILE: LOCATION PICKER -->

    <button class="loc-pick-btn loc-pick-btn--indoor" onclick="pickLocation('indoor')">
      <span class="loc-pick-btn__icon">🏠</span>
      <span class="loc-pick-btn__label">V hiši</span>
    </button>
    <button class="loc-pick-btn loc-pick-btn--outdoor" onclick="pickLocation('outdoor')">
      <span class="loc-pick-btn__icon">🌲</span>
      <span class="loc-pick-btn__label">Zunaj</span>
    </button>
    <button class="loc-pick-btn loc-pick-btn--mine" onclick="pickLocation('mine')">
      <span class="loc-pick-btn__icon">⭐</span>
      <span class="loc-pick-btn__label">Moje</span>
    </button>
    <button class="loc-pick-btn loc-pick-btn--all" onclick="pickLocation('all')">
      <span class="loc-pick-btn__icon">🗂</span>
      <span class="loc-pick-btn__label">Vse</span>
    </button>
    <button class="loc-pick-btn loc-pick-btn--skupaj" onclick="pickLocation('skupaj')">

<!-- SETTINGS -->
<div id="settings-panel" class="settings-overlay">
  <div style="background:#fff;border:2.5px solid rgba(0,0,0,.08);border-radius:28px;padding:26px 20px;max-width:320px;width:calc(100% - 32px);display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.2)">

    <button onclick="lonaDebug();document.getElementById('settings-panel').style.display='none'" style="padding:13px;border-radius:16px;background:#EFF6FF;border:2.5px solid #007AFF;color:#007AFF;font-size:.9rem;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 4px 0 #0055B3">🔍 Debug (konzola)</button>

<script>
if (!localStorage.getItem("lona_current_agent")) location.replace("index.html");

document.getElementById("settings-panel").addEventListener("click", e => {
  if (e.target === document.getElementById("settings-panel"))
    document.getElementById("settings-panel").style.display = "none";
});

window.addEventListener('pageshow', () => {
  if (typeof renderCmdAgents === 'function') renderCmdAgents();
  _refreshCurrentView();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

// Nočno ozadje
(function() {
  const h = new Date().getHours();
  if (h >= 19 || h < 6) {
    const img = document.getElementById('bg-source');
    if (img) {
      const t = new Image();
      t.onload = () => { img.src = 'assets/bg-night.png'; document.body.style.background = '#1A1446'; };
      t.src = 'assets/bg-night.png';
    }
  }
})();

/* ── ARENA — mobil + desktop ───────────────────────────── */
function _initDesktopArena() {
  const wrap = document.getElementById('desktop-arena-wrap');
  if (!wrap || wrap.children.length > 0) return;

  const isMobile = window.innerWidth < 768;
  const screenW  = Math.min(window.innerWidth, 480);

  const circleSize = isMobile ? Math.round(screenW * 0.44) : 320;
  const orbitR     = isMobile ? Math.round(screenW * 0.37) : 240;
  const size       = isMobile ? Math.round(screenW * 1.0)  : 760;
  const cX = size / 2, cY = size / 2;

  const locs = [
    { key:'eq',      icon:'⚡', label:'EQ',     angle:-120 },
    { key:'skupaj',  icon:'👥', label:'Skupaj', angle:-60  },
    { key:'indoor',  icon:'🏠', label:'V hiši', angle:0    },
    { key:'all',     icon:'🗂', label:'Vse',    angle:60   },
    { key:'mine',    icon:'⭐', label:'Moje',   angle:120  },
    { key:'outdoor', icon:'🌲', label:'Zunaj',  angle:180  },
  ];

  wrap.innerHTML = `
    <div class="desktop-arena" style="overflow:visible">
      <div class="da-agent-row">
        <div class="da-agent-circle" id="desktop-agent-card"></div>
      </div>
      <div id="da-mission-row" data-parallax="2"
           style="position:relative;width:${size}px;height:${size}px;
                  flex-shrink:0;overflow:visible;margin:0 auto">
        <div id="arena-circle" data-parallax="3"
             style="position:absolute;top:50%;left:50%;
                    transform:translate(-50%,-50%);
                    width:${circleSize}px;height:${circleSize}px;
                    border-radius:50%;overflow:visible;z-index:2;
                    background:transparent;
                    display:flex;flex-direction:column;align-items:center;
                    justify-content:flex-end;text-align:center;cursor:pointer;">
        </div>
      </div>
    </div>`;

  // Orbit gumbi
  const row = document.getElementById('da-mission-row');
  locs.forEach(l => {
    const rad = l.angle * Math.PI / 180;
    const x = cX + orbitR * Math.cos(rad);
    const y = cY + orbitR * Math.sin(rad);
    const btn = document.createElement('button');
    btn.className = `da-loc-btn da-loc--${l.key}`;
    btn.style.cssText = `position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%)`;
    btn.innerHTML = `<span class="da-icon">${l.icon}</span><span class="da-label">${l.label}</span>`;
    btn.onclick = () => _dLoc(l.key);
    row.appendChild(btn);
  });

  // Skrij staro
  const fb = document.getElementById('loc-pick-fallback');
  if (fb) fb.style.display = 'none';
  const mw = document.getElementById('random-mission-wrap');
  if (mw) mw.style.display = 'none';
  const rw = document.querySelector('.ribbon-wrap');
  if (rw) rw.style.display = 'none';

  if (typeof renderCmdAgents === 'function') renderCmdAgents();
  setTimeout(() => _dLoc('indoor'), 80);
}

// Trenutna lokacija in misija za areno
let _arenaLoc = 'indoor';
let _arenaMission = null;

function _dLoc(loc) {
  _arenaLoc = loc;
  document.querySelectorAll('.da-loc-btn').forEach(b => b.classList.remove('da-loc--active'));
  const btn = document.querySelector('.da-loc--' + loc);
  if (btn) btn.classList.add('da-loc--active');
  _arenaPickMission(loc);
  _arenaShowScratch(loc);
}

function _arenaPickMission(loc) {
  if (typeof LONA_CONFIG === 'undefined') return;
  const hidden = window._hiddenMissions || JSON.parse(localStorage.getItem('lona_hidden_missions') || '[]');
  const customs = typeof customLoad === 'function'
    ? (Array.isArray(customLoad()) ? customLoad() : Object.values(customLoad())) : [];

  let pool = [];
  if (loc === 'mine') {
    pool = customs.filter(m => !hidden.includes(m.id) && !(typeof isOnCooldown==='function' && isOnCooldown(m.id)));
  } else {
    pool = Object.values(LONA_CONFIG.missions).filter(m => {
      if (hidden.includes(m.id)) return false;
      if (typeof isOnCooldown==='function' && isOnCooldown(m.id)) return false;
      if (loc==='eq')      return m.category==='eq';
      if (loc==='indoor')  return (m.location==='indoor'||m.location==='any') && m.category!=='eq';
      if (loc==='outdoor') return (m.location==='outdoor'||m.location==='any'||m.category==='outdoor'||m.category==='body'||m.category==='fear') && m.category!=='eq';
      if (loc==='skupaj')  return m.category==='social'||m.tags?.includes('skupaj')||m.location==='any';
      return true;
    });
  }
  if (!pool.length) { _arenaMission = null; return; }
  _arenaMission = pool[Math.floor(Math.random() * pool.length)];
}

function _arenaShowScratch(loc) {
  const circle = document.getElementById('arena-circle');
  if (!circle) return;

  const sz = parseInt(circle.style.width) || 180;
  const labels = {eq:'EQ misija te čaka',indoor:'Misija v hiši te čaka',
    outdoor:'Zunanja misija',mine:'Posebna misija',skupaj:'Skupna misija',all:'Naključna misija'};

  circle.style.background = 'transparent';
  circle.style.boxShadow = 'none';
  circle.style.overflow = 'visible';
  circle.onclick = _arenaReveal;
  const ms1 = Math.round(sz * 1.15);
  circle.innerHTML = `
    <img src="assets/mascot.png" alt="maskota"
      style="width:${ms1}px;height:${ms1}px;object-fit:contain;object-position:bottom;
             display:block;margin-bottom:-${Math.round(sz*0.06)}px;
             filter:drop-shadow(0 6px 12px rgba(0,0,0,.2));
             animation:float-q 3s ease-in-out infinite;pointer-events:none"/>
    <button onclick="event.stopPropagation();_arenaReveal()"
      style="padding:${Math.round(sz*0.035)}px ${Math.round(sz*0.1)}px;border-radius:50px;
             background:#AF52DE;border:3px solid #7B2FA8;
             color:#fff;font-size:${Math.max(9,Math.round(sz*0.062))}px;
             font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;
             box-shadow:0 4px 0 #7B2FA8;margin-bottom:${Math.round(sz*0.04)}px;
             position:relative;z-index:5;white-space:nowrap">
      Izvleči 🎲
    </button>`;
}

function _arenaReveal() {
  const circle = document.getElementById('arena-circle');
  if (!circle) return;

  if (!_arenaMission) {
    _arenaPickMission(_arenaLoc);
    if (!_arenaMission) {
      const sz2 = parseInt(circle.style.width)||180;
      circle.style.background = 'linear-gradient(135deg,#1a2a1a,#2d4a2d)';
      circle.innerHTML = `<span style="font-size:${Math.round(sz2*0.22)}px">🔒</span>
        <p style="font-size:${Math.max(8,Math.round(sz2*0.06))}px;color:rgba(255,255,255,.7);margin:6px 10%;line-height:1.3;font-weight:700">Vse opravljeno!</p>`;
      return;
    }
  }

  const m   = _arenaMission;
  const sz  = parseInt(circle.style.width) || 180;
  const xp  = m.baseXp || m.xp || 20;
  const coins = m.coins || Math.round(xp * (typeof LONA_CONFIG !== 'undefined' ? (LONA_CONFIG.coinsPerXp||0.4) : 0.4));

  const CAT_G = {
    hygiene:['#34C759','#248A3D'],cleaning:['#007AFF','#0055B3'],
    kitchen:['#FF9500','#C47000'],organisation:['#AF52DE','#7B2FA8'],
    fitness:['#FF6B00','#C44E00'],outdoor:['#30D158','#1E8F3A'],
    eq:['#BF5AF2','#8944AB'],fear:['#FF2D55','#C0002E'],
    creativity:['#FFD60A','#B89800'],social:['#5AC8FA','#0070A8'],
    custom:['#34C759','#248A3D'],
  };
  const g = CAT_G[m.category] || ['#007AFF','#0055B3'];

  circle.style.background = 'transparent';
  circle.style.boxShadow = 'none';
  circle.style.overflow = 'visible';
  circle.onclick = () => { _arenaPickMission(_arenaLoc); _arenaShowScratch(_arenaLoc); };
  const ms2 = Math.round(sz * 1.15);
  circle.innerHTML = `
    <img src="assets/mascot.png" alt="maskota"
      style="width:${ms2}px;height:${ms2}px;object-fit:contain;object-position:bottom;
             display:block;margin-bottom:-${Math.round(sz*0.06)}px;
             filter:drop-shadow(0 6px 12px rgba(0,0,0,.2));pointer-events:none"/>
    <div style="background:${g[0]};border:3px solid rgba(0,0,0,.12);border-radius:18px;
                padding:8px 12px;box-shadow:0 5px 0 ${g[1]};
                text-align:center;margin-bottom:${Math.round(sz*0.04)}px;
                position:relative;z-index:5;min-width:${Math.round(sz*0.85)}px">
      <div style="font-size:${Math.round(sz*0.13)}px">${m.icon||'📋'}</div>
      <p style="font-family:'Nunito',sans-serif;font-size:${Math.max(9,Math.round(sz*0.072))}px;
               color:#fff;font-weight:900;line-height:1.2;
               text-shadow:0 1px 2px rgba(0,0,0,.2)">${m.label}</p>
      <div style="display:flex;gap:3px;justify-content:center;margin-top:3px">
      <span style="font-size:${Math.max(8,Math.round(sz*0.055))}px;font-weight:900;color:#fff;background:rgba(0,0,0,.2);padding:3px 9px;border-radius:20px;font-family:'Nunito',sans-serif">+${xp} XP</span>
      <span style="font-size:${Math.max(8,Math.round(sz*0.055))}px;font-weight:900;color:#FFD60A;background:rgba(0,0,0,.2);padding:3px 9px;border-radius:20px;font-family:'Nunito',sans-serif">🪙${coins}</span>
    </div>
    <button onclick="event.stopPropagation();_arenaDoMission()"
      style="margin-top:6px;padding:${Math.round(sz*0.035)}px ${Math.round(sz*0.09)}px;
             border-radius:50px;background:#fff;color:${g[0]};
             font-size:${Math.max(9,Math.round(sz*0.065))}px;font-weight:900;
             border:none;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.12)">
      ✓ Opravi
    </button>`;
}

function _arenaDoMission() {
  if (!_arenaMission) return;
  const agentId = getCurrentAgent();
  if (!isGatekeeperApproved()) { lonaToast('Najprej opravi Standard 0! 🔒','red'); return; }
  if (typeof isDailyLocked==='function' && isDailyLocked(agentId)) { lonaToast('Dnevni limit dosežen! 🔒','red'); return; }
  showQualityCheck(agentId, _arenaMission, null, (compromised) => {
    const xp = compromised ? Math.floor((_arenaMission.baseXp||_arenaMission.xp||20)/2) : (_arenaMission.baseXp||_arenaMission.xp||20);
    const coins = _arenaMission.coins || Math.round(xp*(LONA_CONFIG.coinsPerXp||0.4));
    addXp(agentId, xp);
    if (!compromised && _arenaMission.cooldownHrs) setCooldown(_arenaMission.id, _arenaMission.cooldownHrs);
    logMission(agentId, _arenaMission.id, xp, {label:_arenaMission.label}, compromised);
    if (typeof showXpFloat==='function') showXpFloat(xp);
    lonaToast(compromised ? `⚠️ Površno — +${xp} XP` : `+${xp} XP  +${coins} 🪙 ✓`, compromised?'red':'green');
    if (typeof renderCmdAgents==='function') renderCmdAgents();
    setTimeout(() => _dLoc(_arenaLoc), 400);
  });
}

window.addEventListener('DOMContentLoaded', _initDesktopArena);
window.addEventListener('resize', () => {
  const wrap = document.getElementById('desktop-arena-wrap');
  if (wrap) wrap.innerHTML = '';
  _initDesktopArena();
});
</script>
