<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#1E2438"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="manifest" href="manifest.json"/>
<title>LONA OS — Commander</title>
<link rel="stylesheet" href="shared.css"/>
<style>
body { padding-bottom: 40px; }

.cmd-header {
  padding: 20px 16px 12px;
  display: flex; align-items: center; gap: 12px;
}
.cmd-header__icon { font-size: 1.8rem; }
.cmd-header__title {
  font-family: var(--font-display);
  font-size: 1.4rem; color: var(--text); line-height: 1.1;
}
.cmd-header__sub {
  font-size: .72rem; color: var(--text-muted);
  margin-top: 2px;
}

/* Agent cards */
.agents-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; padding: 0 16px;
}
.agent-cmd-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.agent-cmd-card__top {
  display: flex; align-items: center; gap: 10px;
}
.agent-cmd-card__avatar {
  width: 40px; height: 40px; border-radius: 50%;
  overflow: hidden; background: rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; flex-shrink: 0;
  border: 2px solid rgba(90,175,122,.3);
}
.agent-cmd-card__avatar img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top;
}
.agent-cmd-card__name {
  font-size: .95rem; font-weight: 800; color: var(--text); margin: 0;
}
.agent-cmd-card__rank {
  font-size: .6rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--gold); margin: 0;
}
.stat-row {
  display: flex; gap: 6px;
}
.stat-pill {
  flex: 1; text-align: center; padding: 6px 4px;
  background: rgba(255,255,255,.10);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
}
.stat-pill__val {
  font-size: .95rem; font-weight: 800; color: var(--text);
  line-height: 1; margin: 0;
}
.stat-pill__lbl {
  font-size: .55rem; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .08em;
  margin: 2px 0 0;
}

/* Sections */
.cmd-section {
  padding: 16px 16px 0;
}
.cmd-section__title {
  font-family: var(--font-display);
  font-size: 1rem; color: var(--text);
  margin-bottom: 10px;
}

/* Mission list (commander view) */
.cmd-mission-list {
  display: flex; flex-direction: column; gap: 6px;
}
.cmd-mission-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  transition: all .15s ease;
}
.cmd-mission-row--hidden {
  opacity: .4;
  border-style: dashed;
}
.cmd-mission-row__icon { font-size: 1.1rem; flex-shrink: 0; }
.cmd-mission-row__body { flex: 1; min-width: 0; }
.cmd-mission-row__name {
  font-size: .85rem; font-weight: 700; color: var(--text); margin: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cmd-mission-row__meta {
  font-size: .65rem; color: var(--text-muted); margin: 1px 0 0;
}
.cmd-mission-row__actions {
  display: flex; gap: 5px; flex-shrink: 0;
}
.cmd-action-btn {
  width: 28px; height: 28px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: .75rem; font-weight: 700;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer; transition: all .15s ease;
}
.cmd-action-btn--hide  { color: rgba(240,238,248,.6); }
.cmd-action-btn--show  { color: var(--green); border-color: rgba(90,175,122,.3); }
.cmd-action-btn--del   { color: var(--red); border-color: rgba(255,59,48,.2); }

/* Add form */
.add-form {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.add-form__row {
  display: grid; gap: 8px;
}
.add-form__row--2 { grid-template-columns: 1fr 1fr; }
.add-form__row--3 { grid-template-columns: 60px 1fr 80px; }
.form-label {
  font-size: .65rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-muted);
  margin-bottom: 4px; display: block;
}
.form-input {
  background: rgba(255,255,255,.09);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text); padding: 10px 12px;
  font-size: .88rem; font-family: var(--font-body);
  outline: none; width: 100%;
}
.form-input:focus { border-color: rgba(90,175,122,.4); }
.form-select {
  background: rgba(255,255,255,.09);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text); padding: 10px 12px;
  font-size: .88rem; font-family: var(--font-body);
  outline: none; width: 100%;
}
.form-select option { background: #2A3050; }

.add-btn {
  width: 100%; padding: 13px;
  background: rgba(45,125,82,.2);
  border: 1px solid rgba(90,175,122,.35);
  border-radius: var(--r-md);
  color: var(--green); font-size: .9rem; font-weight: 800;
  font-family: var(--font-body); cursor: pointer;
  transition: all .2s ease;
}
.add-btn:active { transform: scale(.97); }

/* Reward list */
.cmd-reward-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.cmd-reward-row__icon { font-size: 1.2rem; }
.cmd-reward-row__body { flex: 1; }
.cmd-reward-row__name { font-size: .85rem; font-weight: 700; color: var(--text); margin: 0; }
.cmd-reward-row__cost { font-size: .65rem; color: var(--gold); margin: 1px 0 0; }

/* Back button */
.back-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.back-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-dim); font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.back-title {
  font-size: .8rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-muted);
}

/* Tabs */
.cmd-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
}
.cmd-tab {
  padding: 10px 16px; font-size: .8rem; font-weight: 700;
  color: var(--text-muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .2s ease;
}
.cmd-tab--active { color: var(--green); border-bottom-color: var(--green); }

.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>

<div class="back-bar">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="back-title">Commander Panel</span>
</div>

<!-- Agent pregled -->
<div class="cmd-header">
  <span class="cmd-header__icon">🎖️</span>
  <div>
    <p class="cmd-header__title">Pregled Agentov</p>
    <p class="cmd-header__sub">Točke, kovanci, jokerji</p>
  </div>
</div>

<div class="agents-row" id="agents-row"></div>

<!-- Tabs -->
<div class="cmd-tabs" style="margin-top:16px">
  <div class="cmd-tab cmd-tab--active" onclick="switchTab('missions')">⚔️ Misije</div>
  <div class="cmd-tab" onclick="switchTab('rewards')">🏆 Nagrade</div>
  <div class="cmd-tab" onclick="switchTab('add-mission')">+ Misija</div>
  <div class="cmd-tab" onclick="switchTab('mine')">⭐ Moje</div>
  <div class="cmd-tab" onclick="switchTab('add-reward')">+ Nagrada</div>
</div>

<!-- TAB: Misije -->
<div class="tab-content active cmd-section" id="tab-missions">
  <div style="margin-bottom:10px">
    <input class="form-input" id="mission-search" placeholder="🔍 Išči misije..." oninput="renderMissionList()"/>
  </div>
  <div class="cmd-mission-list" id="cmd-mission-list"></div>
</div>

<!-- TAB: Nagrade -->
<div class="tab-content cmd-section" id="tab-rewards">
  <p style="font-size:.8rem;color:var(--text-muted);margin-bottom:10px">Osebne nagrade</p>
  <div class="cmd-mission-list" id="cmd-rewards-personal"></div>
  <p style="font-size:.8rem;color:var(--text-muted);margin:14px 0 10px">Skupne nagrade</p>
  <div class="cmd-mission-list" id="cmd-rewards-shared"></div>
</div>

<!-- TAB: Dodaj misijo -->
<div class="tab-content cmd-section" id="tab-add-mission">
  <div class="add-form">
    <p class="cmd-section__title" style="margin-bottom:0">Nova misija</p>
    <div class="add-form__row add-form__row--3">
      <div>
        <label class="form-label">Ikona</label>
        <input class="form-input" id="m-icon" placeholder="🌟" style="text-align:center;font-size:1.3rem"/>
      </div>
      <div>
        <label class="form-label">Naziv</label>
        <input class="form-input" id="m-label" placeholder="Npr. Pomagaj sosedu"/>
      </div>
      <div>
        <label class="form-label">XP</label>
        <input class="form-input" id="m-xp" type="number" placeholder="20" value="20"/>
      </div>
    </div>
    <div class="add-form__row add-form__row--2">
      <div>
        <label class="form-label">Kovanci 🪙</label>
        <input class="form-input" id="m-coins" type="number" placeholder="8" value="8"/>
      </div>
      <div>
        <label class="form-label">Kategorija</label>
        <select class="form-select" id="m-category">
          <option value="hygiene">Higiena</option>
          <option value="cleaning">Čiščenje</option>
          <option value="kitchen">Kuhinja</option>
          <option value="organisation">Organizacija</option>
          <option value="fitness">Telovadba</option>
          <option value="outdoor">Outdoor</option>
          <option value="eq">EQ</option>
          <option value="fear">Strah</option>
          <option value="creativity">Branje</option>
          <option value="custom" selected>Moje</option>
        </select>
      </div>
    </div>
    <div class="add-form__row add-form__row--2">
      <div>
        <label class="form-label">Lokacija</label>
        <select class="form-select" id="m-location">
          <option value="indoor">V hiši 🏠</option>
          <option value="outdoor">Zunaj 🌲</option>
          <option value="any" selected>Kjerkoli</option>
        </select>
      </div>
      <div>
        <label class="form-label">Cooldown (ure)</label>
        <input class="form-input" id="m-cooldown" type="number" placeholder="24" value="24"/>
      </div>
    </div>
    <div>
      <label class="form-label">Opis (neobvezno)</label>
      <input class="form-input" id="m-desc" placeholder="Kratko navodilo..."/>
    </div>
    <button class="add-btn" onclick="addMission()">✓ Dodaj Misijo</button>
  </div>
</div>

<!-- TAB: Moje misije -->
<div class="tab-content cmd-section" id="tab-mine">
  <p style="font-size:.75rem;color:var(--text-muted);margin-bottom:12px">
    Misije ki jih dodata otroka vidita pod ⭐ Moje na glavni strani.
  </p>
  <div class="add-form" style="margin-bottom:12px">
    <p class="cmd-section__title" style="margin-bottom:0">Dodaj v Moje misije</p>
    <div class="add-form__row add-form__row--3">
      <div>
        <label class="form-label">Ikona</label>
        <input class="form-input" id="mm-icon" placeholder="⭐" style="text-align:center;font-size:1.3rem"/>
      </div>
      <div>
        <label class="form-label">Naziv</label>
        <input class="form-input" id="mm-label" placeholder="Npr. Pomagaj pri nakupu"/>
      </div>
      <div>
        <label class="form-label">XP</label>
        <input class="form-input" id="mm-xp" type="number" value="25"/>
      </div>
    </div>
    <div class="add-form__row add-form__row--2">
      <div>
        <label class="form-label">🪙 Kovanci</label>
        <input class="form-input" id="mm-coins" type="number" value="10"/>
      </div>
      <div>
        <label class="form-label">Opis</label>
        <input class="form-input" id="mm-desc" placeholder="Kratko navodilo..."/>
      </div>
    </div>
    <button class="add-btn" onclick="addMineMission()">⭐ Dodaj v Moje</button>
  </div>
  <div class="cmd-mission-list" id="mine-list"></div>
</div>

<!-- TAB: Dodaj nagrado -->
<div class="tab-content cmd-section" id="tab-add-reward">
  <div class="add-form">
    <p class="cmd-section__title" style="margin-bottom:0">Nova nagrada</p>
    <div class="add-form__row add-form__row--3">
      <div>
        <label class="form-label">Ikona</label>
        <input class="form-input" id="r-icon" placeholder="🎁" style="text-align:center;font-size:1.3rem"/>
      </div>
      <div>
        <label class="form-label">Naziv</label>
        <input class="form-input" id="r-label" placeholder="Npr. Pizza večer"/>
      </div>
      <div>
        <label class="form-label">🪙 Cena</label>
        <input class="form-input" id="r-cost" type="number" placeholder="50" value="50"/>
      </div>
    </div>
    <div>
      <label class="form-label">Tip</label>
      <select class="form-select" id="r-type">
        <option value="personal">Osebno (1 agent)</option>
        <option value="shared">Skupaj (oba agenta)</option>
      </select>
    </div>
    <button class="add-btn" onclick="addReward()">✓ Dodaj Nagrado</button>
  </div>
</div>

<script src="config.js"></script>
<script src="engine/xp.js"></script>
<script src="engine/joker.js"></script>
<script src="engine/cooldown.js"></script>
<script src="engine/custom_missions.js"></script>

<script>
if(typeof initXp==="function") initXp();
if(typeof initJokers==="function") initJokers();
if(typeof initCoins==="function") initCoins();

// ── TABS ──────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.cmd-tab').forEach(t => t.classList.remove('cmd-tab--active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('cmd-tab--active');
  if (name === 'mine') renderMineList();
  if (name === 'missions') renderMissionList();
}

// ── AGENTS ────────────────────────────────────────────────
function renderAgents() {
  const el = document.getElementById('agents-row');
  el.innerHTML = LONA_CONFIG.agents.map(a => {
    const xp     = typeof getXp    === "function" ? getXp(a.id)    : 0;
    const maxXp  = typeof getMaxXp === "function" ? getMaxXp(a.id) : 0;
    const coins  = typeof getCoins === "function" ? getCoins(a.id) : 0;
    const jokers = typeof getJokers=== "function" ? getJokers(a.id): 0;
    const rank   = LONA_CONFIG.ranks.slice().reverse().find(r => maxXp >= r.minXp)?.label || LONA_CONFIG.ranks[0].label;
    const photo  = localStorage.getItem('lona_photo_' + a.id);
    const avHtml = photo
      ? `<img src="${photo}">`
      : `<span>${a.avatar}</span>`;

    return `<div class="agent-cmd-card">
      <div class="agent-cmd-card__top">
        <div style="position:relative;flex-shrink:0;cursor:pointer" onclick="document.getElementById('photo-input-${a.id}').click()" title="Zamenjaj foto">
          <div class="agent-cmd-card__avatar">${avHtml}</div>
          <div style="position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;
            background:#4A9E6A;border:2px solid #232840;display:flex;align-items:center;
            justify-content:center;font-size:.6rem">📷</div>
        </div>
        <input type="file" id="photo-input-${a.id}" accept="image/*" style="display:none"
          onchange="handleCmdPhoto(this,'${a.id}')">
        <div>
          <p class="agent-cmd-card__name">${a.name}</p>
          <p class="agent-cmd-card__rank">${rank}</p>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-pill">
          <p class="stat-pill__val" style="color:#72D68A">${xp}</p>
          <p class="stat-pill__lbl">XP prosto</p>
        </div>
        <div class="stat-pill">
          <p class="stat-pill__val" style="color:#FFD60A">${coins}</p>
          <p class="stat-pill__lbl">🪙 Kovanci</p>
        </div>
        <div class="stat-pill">
          <p class="stat-pill__val" style="color:#CF8FFF">${jokers}</p>
          <p class="stat-pill__lbl">🃏 Jokerji</p>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <input id="name-input-${a.id}" value="${a.name}"
          style="flex:1;padding:7px 10px;border-radius:var(--r-sm);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);color:#F0EEF8;font-size:.82rem;font-family:'DM Sans',sans-serif;outline:none"/>
        <button onclick="saveName('${a.id}')"
          style="padding:7px 12px;border-radius:var(--r-sm);background:rgba(120,160,255,.2);border:1px solid rgba(90,175,122,.3);color:#72D68A;font-size:.75rem;font-weight:800;cursor:pointer;white-space:nowrap">✓ Shrani</button>
      </div>
      <div style="display:flex;gap:6px">
        <button onclick="giveBonus('${a.id}',25,'xp')"
          style="flex:1;padding:7px;border-radius:var(--r-sm);background:rgba(120,160,255,.18);border:1px solid rgba(90,175,122,.25);color:#72D68A;font-size:.75rem;font-weight:800;cursor:pointer">+25 XP</button>
        <button onclick="giveBonus('${a.id}',10,'coins')"
          style="flex:1;padding:7px;border-radius:var(--r-sm);background:rgba(255,214,10,.1);border:1px solid rgba(255,214,10,.25);color:#FFD60A;font-size:.75rem;font-weight:800;cursor:pointer">+10 🪙</button>
        <button onclick="giveBonus('${a.id}',1,'joker')"
          style="flex:1;padding:7px;border-radius:var(--r-sm);background:rgba(207,143,255,.1);border:1px solid rgba(207,143,255,.25);color:#CF8FFF;font-size:.75rem;font-weight:800;cursor:pointer">+1 🃏</button>
      </div>
    </div>`;
  }).join('');
}

function handleCmdPhoto(input, agentId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = Math.min(img.width, img.height);
      canvas.width = canvas.height = 400;
      canvas.getContext('2d').drawImage(img,
        (img.width-size)/2,(img.height-size)/2,size,size,0,0,400,400);
      const data = canvas.toDataURL('image/jpeg', .8);
      localStorage.setItem('lona_photo_' + agentId, data);
      showMsg('📷 Foto shranjena!');
      renderAgents();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveName(agentId) {
  const input = document.getElementById('name-input-' + agentId);
  if (!input || !input.value.trim()) return;
  const names = JSON.parse(localStorage.getItem('lona_agent_names') || '{}');
  names[agentId] = input.value.trim();
  localStorage.setItem('lona_agent_names', JSON.stringify(names));
  // Posodobi config
  const agent = LONA_CONFIG.agents.find(a => a.id === agentId);
  if (agent) agent.name = input.value.trim();
  showMsg(`✓ Ime spremenjeno na "${input.value.trim()}"`);
  renderAgents();
}

function giveBonus(agentId, amount, type) {
  if(type === 'xp') {
    if(typeof addXp === "function") addXp(agentId, amount);
    showMsg(`+${amount} XP za ${LONA_CONFIG.agents.find(a=>a.id===agentId)?.name}! ✓`);
  } else if(type === 'coins') {
    if(typeof addCoins === "function") addCoins(agentId, amount);
    showMsg(`+${amount} 🪙 za ${LONA_CONFIG.agents.find(a=>a.id===agentId)?.name}! ✓`);
  } else if(type === 'joker') {
    if(typeof earnJoker === "function") earnJoker(agentId, amount);
    showMsg(`+${amount} 🃏 za ${LONA_CONFIG.agents.find(a=>a.id===agentId)?.name}! ✓`);
  }
  renderAgents();
}

// ── MISSION LIST ──────────────────────────────────────────
function getHiddenMissions() {
  return JSON.parse(localStorage.getItem('lona_hidden_missions') || '[]');
}
function setHidden(id, hide) {
  const hidden = getHiddenMissions();
  if(hide && !hidden.includes(id)) hidden.push(id);
  if(!hide) { const i = hidden.indexOf(id); if(i>=0) hidden.splice(i,1); }
  localStorage.setItem('lona_hidden_missions', JSON.stringify(hidden));
  renderMissionList();
}

function renderMissionList() {
  const el     = document.getElementById('cmd-mission-list');
  const search = document.getElementById('mission-search')?.value.toLowerCase() || '';
  const hidden = getHiddenMissions();

  const customs = typeof customLoad === "function"
    ? (Array.isArray(customLoad()) ? customLoad() : Object.values(customLoad()))
    : [];

  const all = [
    ...Object.values(LONA_CONFIG.missions),
    ...customs,
  ].filter(m => !search || m.label.toLowerCase().includes(search));

  el.innerHTML = all.map(m => {
    const isHidden  = hidden.includes(m.id);
    const isCustom  = !LONA_CONFIG.missions[m.id];
    const catName   = {hygiene:'Higiena',cleaning:'Čiščenje',kitchen:'Kuhinja',
      organisation:'Organizacija',fitness:'Telovadba',outdoor:'Outdoor',
      eq:'EQ',fear:'Strah',creativity:'Branje',custom:'Moje',
      social:'Socialne',money:'Denar',body:'Telo',safety:'Varnost'}[m.category] || m.category;
    return `<div class="cmd-mission-row ${isHidden ? 'cmd-mission-row--hidden' : ''}" style="flex-direction:column;align-items:stretch;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="cmd-mission-row__icon">${m.icon||'📋'}</span>
        <div class="cmd-mission-row__body">
          <p class="cmd-mission-row__name">${m.label}</p>
          <p class="cmd-mission-row__meta">${catName}</p>
        </div>
        <div style="display:flex;gap:4px">
          <button class="cmd-action-btn" onclick="addToMine('${m.id}')"
            title="Dodaj v Moje" style="color:#FF9500;border-color:rgba(255,149,0,.3);font-size:.65rem;width:auto;padding:0 8px;white-space:nowrap">⭐</button>
          <button class="cmd-action-btn ${isHidden?'cmd-action-btn--show':'cmd-action-btn--hide'}"
            onclick="setHidden('${m.id}',${!isHidden})">${isHidden?'👁':'🙈'}</button>
          ${isCustom?`<button class="cmd-action-btn cmd-action-btn--del" onclick="deleteCustom('${m.id}')">🗑</button>`:''}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 4px">
        <div>
          <label style="font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:3px">XP</label>
          <input type="number" value="${m.xp||m.baseXp||0}" min="0"
            onchange="updateMissionVal('${m.id}','xp',this.value,'${isCustom}')"
            style="width:100%;padding:6px 10px;border-radius:10px;background:rgba(90,175,122,.08);border:1px solid rgba(120,160,255,.25);color:#72D68A;font-size:.85rem;font-weight:800;outline:none;font-family:'DM Sans',sans-serif"/>
        </div>
        <div>
          <label style="font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:3px">🪙 Kovanci</label>
          <input type="number" value="${m.coins||0}" min="0"
            onchange="updateMissionVal('${m.id}','coins',this.value,'${isCustom}')"
            style="width:100%;padding:6px 10px;border-radius:10px;background:rgba(255,214,10,.08);border:1px solid rgba(255,214,10,.2);color:#FFD60A;font-size:.85rem;font-weight:800;outline:none;font-family:'DM Sans',sans-serif"/>
        </div>
      </div>
    </div>`;
  }).join('') || '<p style="color:var(--text-muted);font-size:.82rem;text-align:center;padding:20px">Ni misij.</p>';
}

function addToMine(missionId) {
  const m = LONA_CONFIG.missions[missionId];
  if (!m) return;
  const existing = JSON.parse(localStorage.getItem('lona_custom_missions') || '[]');
  // Preveri če je že v Moje
  if (existing.find(x => x.id === missionId || x.sourceId === missionId)) {
    showMsg(`"${m.label}" je že v Moje misijah!`, true);
    return;
  }
  // Dodaj kopijo z oznako sourceId
  existing.push({ ...m, id:'mine_'+missionId, sourceId:missionId, category:'custom' });
  localStorage.setItem('lona_custom_missions', JSON.stringify(existing));
  showMsg(`⭐ "${m.label}" dodana v Moje misije!`);
  renderMineList();
}

function updateMissionVal(id, field, val, isCustom) {
  if (isCustom === 'true') {
    // Custom misija — shrani v localStorage
    const all = JSON.parse(localStorage.getItem('lona_custom_missions') || '[]');
    const m = all.find(x => x.id === id);
    if (m) {
      if (field === 'xp')    { m.xp = parseInt(val)||0; m.baseXp = m.xp; }
      if (field === 'coins') { m.coins = parseInt(val)||0; }
      localStorage.setItem('lona_custom_missions', JSON.stringify(all));
    }
  } else {
    // Config misija — shrani override v localStorage
    const overrides = JSON.parse(localStorage.getItem('lona_mission_overrides') || '{}');
    if (!overrides[id]) overrides[id] = {};
    overrides[id][field] = parseInt(val)||0;
    localStorage.setItem('lona_mission_overrides', JSON.stringify(overrides));
    // Posodobi config v spominu
    if (LONA_CONFIG.missions[id]) {
      if (field === 'xp')    { LONA_CONFIG.missions[id].xp = parseInt(val)||0; LONA_CONFIG.missions[id].baseXp = parseInt(val)||0; }
      if (field === 'coins') { LONA_CONFIG.missions[id].coins = parseInt(val)||0; }
    }
  }
}

function deleteCustom(id) {
  if(!confirm('Izbriši misijo?')) return;
  if(typeof customDelete === "function") customDelete(id);
  renderMissionList();
}

// ── REWARDS LIST ──────────────────────────────────────────
function renderRewardsList() {
  const mkRow = (r, type) => `<div class="cmd-mission-row" style="flex-direction:column;align-items:stretch;gap:8px">
    <div style="display:flex;align-items:center;gap:10px">
      <span id="icon-${r.id}" style="font-size:1.4rem">${r.icon}</span>
      <div style="flex:1">
        <p style="font-size:.85rem;font-weight:700;color:var(--text);margin:0">${r.label}</p>
        <p style="font-size:.65rem;color:#FFD60A;margin:1px 0 0">🪙 ${r.cost}</p>
      </div>
      <button class="cmd-action-btn cmd-action-btn--del"
        onclick="deleteReward('${r.id}','${type}')">🗑</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 70px 50px;gap:6px;padding:0 4px">
      <div>
        <label style="font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:3px">Naziv</label>
        <input id="label-${r.id}" value="${r.label}"
          style="width:100%;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);color:var(--text);font-size:.82rem;outline:none;font-family:'DM Sans',sans-serif"/>
      </div>
      <div>
        <label style="font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:3px">🪙 Cena</label>
        <input type="number" id="cost-${r.id}" value="${r.cost}" min="0"
          style="width:100%;padding:6px 8px;border-radius:10px;background:rgba(255,214,10,.08);border:1px solid rgba(255,214,10,.2);color:#FFD60A;font-size:.82rem;font-weight:800;outline:none;font-family:'DM Sans',sans-serif"/>
      </div>
      <div>
        <label style="font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:3px">Ikona</label>
        <input id="icon-input-${r.id}" value="${r.icon}"
          style="width:100%;padding:6px 4px;border-radius:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);color:var(--text);font-size:1rem;text-align:center;outline:none;font-family:'DM Sans',sans-serif"/>
      </div>
    </div>
    <button onclick="saveReward('${r.id}','${type}')"
      style="width:100%;padding:9px;border-radius:10px;background:rgba(114,214,138,.15);border:1px solid rgba(114,214,138,.35);color:#72D68A;font-size:.82rem;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif">
      ✓ Shrani spremembe
    </button>
  </div>`;

  document.getElementById('cmd-rewards-personal').innerHTML =
    (LONA_CONFIG.rewards.personal || []).map(r => mkRow(r,'personal')).join('') ||
    '<p style="color:var(--text-muted);font-size:.82rem;padding:8px">Ni osebnih nagrad.</p>';

  document.getElementById('cmd-rewards-shared').innerHTML =
    (LONA_CONFIG.rewards.shared || []).map(r => mkRow(r,'shared')).join('') ||
    '<p style="color:var(--text-muted);font-size:.82rem;padding:8px">Ni skupnih nagrad.</p>';
}

function updateReward(id, type, field, val) {
  const list = LONA_CONFIG.rewards[type];
  const r = list.find(x => x.id === id);
  if (!r) return;
  if (field === 'cost')  r.cost  = parseInt(val) || 0;
  if (field === 'label') r.label = val.trim();
  if (field === 'icon')  r.icon  = val.trim();
  localStorage.setItem('lona_custom_rewards', JSON.stringify(LONA_CONFIG.rewards));
}

function saveReward(id, type) {
  const label = document.getElementById('label-' + id)?.value.trim();
  const cost  = parseInt(document.getElementById('cost-' + id)?.value) || 0;
  const icon  = document.getElementById('icon-input-' + id)?.value.trim();
  const list  = LONA_CONFIG.rewards[type];
  const r     = list.find(x => x.id === id);
  if (!r) return;
  if (label) r.label = label;
  r.cost = cost;
  if (icon) r.icon = icon;
  localStorage.setItem('lona_custom_rewards', JSON.stringify(LONA_CONFIG.rewards));
  showMsg(`✓ "${r.label}" shranjeno!`);
  renderRewardsList();
}

function deleteReward(id, type) {
  if(!confirm('Izbriši nagrado?')) return;
  const key = type === 'shared' ? 'shared' : 'personal';
  LONA_CONFIG.rewards[key] = LONA_CONFIG.rewards[key].filter(r => r.id !== id);
  // Shrani v localStorage
  localStorage.setItem('lona_custom_rewards', JSON.stringify(LONA_CONFIG.rewards));
  renderRewardsList();
  showMsg('Nagrada izbrisana.');
}

// ── MOJE MISIJE ──────────────────────────────────────────────
function addMineMission() {
  const icon  = document.getElementById('mm-icon').value.trim() || '⭐';
  const label = document.getElementById('mm-label').value.trim();
  const xp    = parseInt(document.getElementById('mm-xp').value) || 25;
  const coins = parseInt(document.getElementById('mm-coins').value) || 10;
  const desc  = document.getElementById('mm-desc').value.trim();

  if (!label) { showMsg('Vnesi naziv misije!', true); return; }

  const existing = JSON.parse(localStorage.getItem('lona_custom_missions') || '[]');
  const id = 'mine_' + Date.now();
  existing.push({ id, label, icon, xp, coins, desc,
    category:'custom', location:'any',
    cooldownHrs:48, season:'osnovno', visible:true, state:'available' });
  localStorage.setItem('lona_custom_missions', JSON.stringify(existing));

  showMsg(`⭐ "${label}" dodana v Moje misije!`);
  document.getElementById('mm-label').value = '';
  document.getElementById('mm-icon').value  = '';
  document.getElementById('mm-desc').value  = '';
  renderMineList();
}

function renderMineList() {
  const el = document.getElementById('mine-list');
  if (!el) return;
  const all = JSON.parse(localStorage.getItem('lona_custom_missions') || '[]')
    .filter(m => m.id.startsWith('mine_') || m.category === 'custom');

  if (!all.length) {
    el.innerHTML = '<p style="color:var(--text-muted);font-size:.82rem;text-align:center;padding:16px">Še ni tvojih misij.</p>';
    return;
  }
  el.innerHTML = all.map(m => `
    <div class="cmd-mission-row" style="flex-direction:column;align-items:stretch;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="cmd-mission-row__icon">${m.icon||'⭐'}</span>
        <div class="cmd-mission-row__body">
          <p class="cmd-mission-row__name">${m.label}</p>
          <p class="cmd-mission-row__meta">${m.desc||''}</p>
        </div>
        <button class="cmd-action-btn cmd-action-btn--del" onclick="deleteMineMission('${m.id}')">🗑</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:0 4px">
        <div>
          <label style="font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:3px">XP</label>
          <input type="number" value="${m.xp||m.baseXp||0}" min="0" max="500"
            onchange="updateMineVal('${m.id}','xp',this.value)"
            style="width:100%;padding:7px 10px;border-radius:10px;background:rgba(90,175,122,.08);border:1px solid rgba(120,160,255,.25);color:#72D68A;font-size:.88rem;font-weight:800;outline:none;font-family:'DM Sans',sans-serif"/>
        </div>
        <div>
          <label style="font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:3px">🪙 Kovanci</label>
          <input type="number" value="${m.coins||0}" min="0" max="500"
            onchange="updateMineVal('${m.id}','coins',this.value)"
            style="width:100%;padding:7px 10px;border-radius:10px;background:rgba(255,214,10,.08);border:1px solid rgba(255,214,10,.2);color:#FFD60A;font-size:.88rem;font-weight:800;outline:none;font-family:'DM Sans',sans-serif"/>
        </div>
        <div style="display:flex;align-items:flex-end">
          <button onclick="updateMineVal('${m.id}','save')"
            style="padding:7px 12px;border-radius:10px;background:rgba(120,160,255,.2);border:1px solid rgba(90,175,122,.3);color:#72D68A;font-size:.75rem;font-weight:800;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif">
            ✓
          </button>
        </div>
      </div>
    </div>`).join('');
}

function updateMineVal(id, field, val) {
  const all = JSON.parse(localStorage.getItem('lona_custom_missions') || '[]');
  const m = all.find(x => x.id === id);
  if (!m) return;
  if (field === 'xp')    { m.xp = parseInt(val) || 0; m.baseXp = m.xp; }
  if (field === 'coins') { m.coins = parseInt(val) || 0; }
  if (field === 'save')  { showMsg('✓ Shranjeno!'); }
  localStorage.setItem('lona_custom_missions', JSON.stringify(all));
}

function deleteMineMission(id) {
  const all = JSON.parse(localStorage.getItem('lona_custom_missions') || '[]')
    .filter(m => m.id !== id);
  localStorage.setItem('lona_custom_missions', JSON.stringify(all));
  renderMineList();
  showMsg('Misija izbrisana.');
}

// ── ADD MISSION ───────────────────────────────────────────
function addMission() {
  const icon     = document.getElementById('m-icon').value.trim() || '⭐';
  const label    = document.getElementById('m-label').value.trim();
  const xp       = parseInt(document.getElementById('m-xp').value) || 20;
  const coins    = parseInt(document.getElementById('m-coins').value) || 8;
  const category = document.getElementById('m-category').value;
  const location = document.getElementById('m-location').value;
  const cooldown = parseInt(document.getElementById('m-cooldown').value) || 24;
  const desc     = document.getElementById('m-desc').value.trim();

  if(!label) { showMsg('Vnesi naziv misije!', true); return; }

  const id = 'custom_' + Date.now();
  const mission = { id, label, icon, xp, coins, category, location,
    cooldownHrs: cooldown, desc, season:'osnovno', visible:true, state:'available' };

  if(typeof customLoad === "function") {
    const existing = Array.isArray(customLoad()) ? customLoad() : Object.values(customLoad());
    existing.push(mission);
    localStorage.setItem('lona_custom_missions', JSON.stringify(existing));
  }

  showMsg(`✓ "${label}" dodana!`);
  document.getElementById('m-label').value = '';
  document.getElementById('m-icon').value  = '';
  document.getElementById('m-desc').value  = '';
  renderMissionList();
  switchTab('missions');
}

// ── ADD REWARD ────────────────────────────────────────────
function addReward() {
  const icon  = document.getElementById('r-icon').value.trim() || '🎁';
  const label = document.getElementById('r-label').value.trim();
  const cost  = parseInt(document.getElementById('r-cost').value) || 50;
  const type  = document.getElementById('r-type').value;

  if(!label) { showMsg('Vnesi naziv nagrade!', true); return; }

  const id = 'reward_' + Date.now();
  LONA_CONFIG.rewards[type === 'shared' ? 'shared' : 'personal'].push({ id, label, icon, cost });
  localStorage.setItem('lona_custom_rewards', JSON.stringify(LONA_CONFIG.rewards));

  showMsg(`✓ "${label}" dodana!`);
  document.getElementById('r-label').value = '';
  document.getElementById('r-icon').value  = '';
  renderRewardsList();
  switchTab('rewards');
}

// ── MSG ───────────────────────────────────────────────────
function showMsg(msg, isError) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    padding:10px 18px;border-radius:30px;font-size:.85rem;font-weight:700;
    background:${isError ? 'rgba(255,59,48,.2)' : 'rgba(45,125,82,.3)'};
    border:1px solid ${isError ? 'rgba(255,59,48,.4)' : 'rgba(90,175,122,.4)'};
    color:${isError ? '#FF6B6B' : '#72D68A'};
    z-index:9999;backdrop-filter:blur(8px);white-space:nowrap`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// ── INIT ──────────────────────────────────────────────────
// Naloži shranjene nagrade
const savedRewards = localStorage.getItem('lona_custom_rewards');
if(savedRewards) {
  try { Object.assign(LONA_CONFIG.rewards, JSON.parse(savedRewards)); } catch(e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  renderAgents();
  renderMissionList();
  renderMineList();
  renderRewardsList();
});
</script>
</body>
</html>
